name: GPU test images

# Builds Home Assistant OS test images with GPU support for apps and publishes
# them as a release. Push a tag "gpu-test-*" on the branch gpu-test-images.
#
# Variants for generic-x86-64 (bare metal) and OVA (virtual machines):
#   amdgpu         AMD and Intel GPUs (drivers in the kernel)
#   nvidia         OS variant nvidia (NVIDIA driver extension), Turing and newer
#   nvidia-legacy  OS variant nvidia-legacy, Maxwell to Volta
# The OS build creates the variants, this workflow only adds the test builds.
#
# The images contain the Supervisor and OS Agent test builds. Home Assistant
# Core (with the GPU frontend) is pulled from GHCR on first boot.

on:
  push:
    tags:
      - "gpu-test-*"
  workflow_dispatch:

env:
  REPO_OWNER: mKenfenheuer
  OS_AGENT_REF: gpu-container-usage
  SUPERVISOR_REF: gpu-test-combined-v2
  CORE_REF: hassio-gpu
  FRONTEND_REF: hardware-gpu
  CLIENT_REF: gpu

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    outputs:
      registry: ${{ steps.vars.outputs.registry }}
      release: ${{ steps.vars.outputs.release }}
      self_signed: ${{ steps.signing.outputs.self_signed }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Variables
        id: vars
        run: |
          echo "registry=ghcr.io/${REPO_OWNER,,}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "release=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release=gpu-test-$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi

      # Only a throwaway key, the repository secrets never leave the build job
      - name: Generate self-signed certificate
        id: signing
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        if: env.RAUC_CERTIFICATE == '' || env.RAUC_PRIVATE_KEY == ''
        run: |
          echo "::warning::No RAUC secrets, building with a public self-signed certificate"
          buildroot-external/scripts/generate-signing-key.sh cert.pem key.pem
          echo "self_signed=true" >> "$GITHUB_OUTPUT"

      - name: Upload self-signed certificate
        if: steps.signing.outputs.self_signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            cert.pem
            key.pem
          retention-days: 1

  os:
    name: Build OS ${{ matrix.board.id }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        board:
          - { id: generic-x86-64, defconfig: generic_x86_64, agent_board: GenericAmd64 }
          - { id: ova, defconfig: ova, agent_board: Ova }
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - name: Add release PKI certs
        if: needs.prepare.outputs.self_signed != 'true'
        env:
          RAUC_CERTIFICATE: ${{ secrets.RAUC_CERTIFICATE }}
          RAUC_PRIVATE_KEY: ${{ secrets.RAUC_PRIVATE_KEY }}
        run: |
          echo -e "-----BEGIN CERTIFICATE-----\n${RAUC_CERTIFICATE}\n-----END CERTIFICATE-----" > cert.pem
          echo -e "-----BEGIN PRIVATE KEY-----\n${RAUC_PRIVATE_KEY}\n-----END PRIVATE KEY-----" > key.pem

      - name: Get self-signed certificate
        if: needs.prepare.outputs.self_signed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: signing-key

      - name: Free space on build drive
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo mkdir -p /mnt/cache /mnt/output
          WORKSPACE_OWNER="$(stat -c '%U:%G' "${GITHUB_WORKSPACE}")"
          sudo ln -sf /mnt/output "${GITHUB_WORKSPACE}/output"
          sudo chown -R "${WORKSPACE_OWNER}" /mnt/cache /mnt/output
          df -h

      - name: "Restore cache: object files"
        uses: actions/cache/restore@v4
        with:
          path: /mnt/cache/cc
          key: haos-gpu-cc-${{ matrix.board.id }}-${{ github.run_id }}
          restore-keys: haos-gpu-cc-${{ matrix.board.id }}-

      - name: Checkout OS Agent
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OWNER }}/os-agent
          ref: ${{ env.OS_AGENT_REF }}
          path: os-agent-src
          persist-credentials: false

      - name: Build OS Agent
        working-directory: os-agent-src
        run: |
          docker run --rm -v "$PWD":/src -w /src -e CGO_ENABLED=0 -e HOME=/tmp \
            -u "$(id -u):$(id -g)" golang:1.26 \
            go build -buildvcs=false -trimpath \
              -ldflags "-s -w -X main.version=1.15.0 -X main.board=${{ matrix.board.agent_board }}" \
              -o /src/os-agent .

      - name: Build builder image
        run: docker build -t haos-builder .

      - name: Build
        run: |
          # Go modules through the Go proxy instead of their origin: Buildroot
          # downloads them with GOPROXY=direct, which fails while an origin like
          # gopkg.in is down. Only in this CI checkout, not committed.
          sed -i 's|^\tGOPROXY=direct \\$|\tGOPROXY=https://proxy.golang.org,direct \\|' buildroot/package/pkg-golang.mk
          grep -q 'GOPROXY=https://proxy.golang.org,direct' buildroot/package/pkg-golang.mk
          builder() {
            docker run --rm --privileged \
              -e BUILDER_UID="$(id -u)" -e BUILDER_GID="$(id -g)" \
              -v "${GITHUB_WORKSPACE}:/build" -v /mnt/cache:/cache -v /mnt/output:/build/output \
              haos-builder "$@"
          }
          builder make ${{ matrix.board.defconfig }}_defconfig
          builder make
          # OS Agent with the GPU interface, the release in Buildroot lacks it
          install -m 0755 os-agent-src/os-agent /mnt/output/target/usr/bin/os-agent
          builder make

      - name: "Save cache: object files"
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /mnt/cache/cc
          key: haos-gpu-cc-${{ matrix.board.id }}-${{ github.run_id }}

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: os-${{ matrix.board.id }}
          path: |
            output/images/haos_*.img.xz
            output/images/haos_*.qcow2.xz
            output/images/haos_*.raucb
          compression-level: 0
          retention-days: 3

  supervisor:
    name: Build Supervisor
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Supervisor
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OWNER }}/supervisor
          ref: ${{ env.SUPERVISOR_REF }}
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          docker build -t local/supervisor-gpu:test \
            --label org.opencontainers.image.source=https://github.com/${REPO_OWNER}/supervisor .
          for tag in "${RELEASE}" gpu-test; do
            docker tag local/supervisor-gpu:test "${REGISTRY}/amd64-hassio-supervisor:${tag}"
            docker push "${REGISTRY}/amd64-hassio-supervisor:${tag}"
          done
          docker save local/supervisor-gpu:test -o supervisor-gpu.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: supervisor
          path: supervisor-gpu.tar
          retention-days: 3

  frontend:
    name: Build frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OWNER }}/frontend
          ref: ${{ env.FRONTEND_REF }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          ./script/build_frontend
          tar -C . -czf hass_frontend.tar.gz hass_frontend

      - name: Upload frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: hass_frontend.tar.gz
          retention-days: 3

  core:
    name: Build Core ${{ matrix.machine }}
    needs: [prepare, frontend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        machine: [generic-x86-64, qemux86-64]
    outputs:
      version: ${{ steps.build.outputs.version }}
    steps:
      - name: Checkout OS repo (Dockerfile)
        uses: actions/checkout@v4
        with:
          path: os
          persist-credentials: false

      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OWNER }}/core
          ref: ${{ env.CORE_REF }}
          path: core
          persist-credentials: false

      - name: Checkout supervisor client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REPO_OWNER }}/python-supervisor-client
          ref: ${{ env.CLIENT_REF }}
          path: client
          persist-credentials: false

      - name: Get frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        env:
          REGISTRY: ${{ needs.prepare.outputs.registry }}
          MACHINE: ${{ matrix.machine }}
        run: |
          mkdir -p ctx/ha
          cp -r core/homeassistant ctx/ha/homeassistant
          cp -r core/script ctx/ha/script
          cp -r client/aiohasupervisor ctx/aiohasupervisor
          tar -C ctx -xzf hass_frontend.tar.gz
          cp os/gpu-test/Dockerfile.core ctx/Dockerfile
          docker build -t core-gpu --build-arg MACHINE="${MACHINE}" \
            --label org.opencontainers.image.source=https://github.com/${REPO_OWNER}/core ctx
          # The Supervisor looks for the image tag of the io.hass.version
          # label, which differs from __version__ on dev builds
          VERSION=$(docker inspect core-gpu --format '{{ index .Config.Labels "io.hass.version" }}')
          docker tag core-gpu "${REGISTRY}/${MACHINE}-homeassistant:${VERSION}"
          docker push "${REGISTRY}/${MACHINE}-homeassistant:${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  variants:
    name: Variants ${{ matrix.board.id }}
    needs: [prepare, os, supervisor, core]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board:
          - { id: generic-x86-64, machine: generic-x86-64, disk: img.xz }
          - { id: ova, machine: qemux86-64, disk: qcow2.xz }
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get OS images
        uses: actions/download-artifact@v4
        with:
          name: os-${{ matrix.board.id }}
          path: images

      - name: Get Supervisor
        uses: actions/download-artifact@v4
        with:
          name: supervisor
          path: inputs

      - name: Build variants
        env:
          CORE_REGISTRY: ${{ needs.prepare.outputs.registry }}
          CORE_VERSION: ${{ needs.core.outputs.version }}
          BOARD: ${{ matrix.board.id }}
          MACHINE: ${{ matrix.board.machine }}
          DISK: ${{ matrix.board.disk }}
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y qemu-utils xz-utils
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          mkdir -p out
          # haos_<board>-<version>, the OS variants are haos_<board>-<variant>-<version>
          BASE=$(basename images/haos_"${BOARD}"-[0-9]*."${DISK}" ".${DISK}")
          VERSION=${BASE#"haos_${BOARD}-"}
          for VARIANT in amdgpu nvidia nvidia-legacy; do
            SRC="${BASE}"
            [ "${VARIANT}" != amdgpu ] && SRC="haos_${BOARD}-${VARIANT}-${VERSION}"
            if [ "${DISK}" = img.xz ]; then
              xz -dc "images/${SRC}.img.xz" > variant.img
            else
              xz -dc "images/${SRC}.qcow2.xz" > base.qcow2
              qemu-img convert -O raw base.qcow2 variant.img
              rm base.qcow2
            fi
            docker run --rm --privileged -v /dev:/dev -v "$PWD":/work \
              -v "$PWD/inputs":/inputs:ro \
              -v "$PWD/gpu-test/make-variant.sh":/make-variant.sh:ro \
              -e CORE_REGISTRY -e CORE_VERSION \
              --entrypoint sh docker:29.8.2-dind /make-variant.sh /work/variant.img "${MACHINE}"
            sudo chown "$(id -u):$(id -g)" variant.img
            NAME="${BASE}-gpu-${VARIANT}"
            if [ "${DISK}" = img.xz ]; then
              xz -T0 -6 -c variant.img > "out/${NAME}.img.xz"
            else
              qemu-img convert -O qcow2 variant.img variant.qcow2
              xz -T0 -6 -c variant.qcow2 > "out/${NAME}.qcow2.xz"
              rm variant.qcow2
            fi
            rm variant.img
          done
          cp images/haos_*.raucb out/
          ls -la out

      - name: Upload variants
        uses: actions/upload-artifact@v4
        with:
          name: variants-${{ matrix.board.id }}
          path: out/*
          compression-level: 0
          retention-days: 3

  release:
    name: Release
    needs: [prepare, core, variants]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Get variants
        uses: actions/download-artifact@v4
        with:
          pattern: variants-*
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: ${{ needs.prepare.outputs.release }}
          CORE_VERSION: ${{ needs.core.outputs.version }}
          REGISTRY: ${{ needs.prepare.outputs.registry }}
        run: |
          cd out
          sha256sum haos_* > SHA256SUMS
          {
            cat ../gpu-test/README.md
            echo
            echo "## Build"
            echo
            echo "- Home Assistant Core: \`${REGISTRY}/<machine>-homeassistant:${CORE_VERSION}\`"
            echo "- Supervisor: \`${REGISTRY}/amd64-hassio-supervisor:${RELEASE}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > notes.md
          gh release create "${RELEASE}" --repo "${GITHUB_REPOSITORY}" --prerelease \
            --title "GPU test images ${RELEASE}" --notes-file notes.md \
            --target "${GITHUB_SHA}" haos_* SHA256SUMS
